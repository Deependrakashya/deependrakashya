<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace" font-size="15" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>GitHub profile card</title>
<style>.ring{animation:spin 14s linear infinite;transform-origin:120px 140px}@keyframes spin{to{transform:rotate(360deg)}}@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.s0{animation:up .5s ease-out 0.20s both}.s1{animation:up .5s ease-out 0.32s both}.s2{animation:up .5s ease-out 0.44s both}.s3{animation:up .5s ease-out 0.56s both}.a0{animation:up .5s ease-out 0.80s both}.a1{animation:up .5s ease-out 0.92s both}.r0{animation:up .5s ease-out 1.10s both}.r1{animation:up .5s ease-out 1.20s both}.r2{animation:up .5s ease-out 1.30s both}.r3{animation:up .5s ease-out 1.40s both}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs>
